name: Generate AI routing rules for Surge

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

env:
  OPENAI_RULES_URL: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          {
            echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)"
            echo "TAG_NAME=$(date +%Y%m%d%H%M)"
          } >> "$GITHUB_ENV"

      - name: Checkout the default branch
        uses: actions/checkout@v7

      - name: Download OpenAI rules
        run: |
          set -euo pipefail
          mkdir -p build Ruleset
          curl --fail --show-error --silent --location --retry 3 \
            "$OPENAI_RULES_URL" \
            --output build/OpenAI.source
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' build/OpenAI.source \
            | sort -u > build/OpenAI.rules
          if ! grep -Eq '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-ASN),' build/OpenAI.rules; then
            echo "Downloaded OpenAI rules are empty or invalid" >&2
            exit 1
          fi

      - name: Generate OpenAI and AI rulesets
        run: |
          set -euo pipefail

          cp build/OpenAI.rules build/ai.rules
          {
            echo "DOMAIN-SUFFIX,meta.ai"
            echo "DOMAIN-SUFFIX,meta.com"
            echo "DOMAIN-SUFFIX,metaaivm.com"
            echo "DOMAIN-SUFFIX,muse.ai"
          } >> build/ai.rules
          sort -u build/ai.rules -o build/ai.rules

          generate_ruleset() {
            input=$1
            output=$2
            title=$3
            domain_count=$(grep -c '^DOMAIN,' "$input" || true)
            domain_suffix_count=$(grep -c '^DOMAIN-SUFFIX,' "$input" || true)
            domain_keyword_count=$(grep -c '^DOMAIN-KEYWORD,' "$input" || true)
            ip_cidr_count=$(grep -c '^IP-CIDR,' "$input" || true)
            ip_asn_count=$(grep -c '^IP-ASN,' "$input" || true)
            others_count=$(grep -Evc '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-ASN),' "$input" || true)
            total_count=$((domain_count + domain_suffix_count + domain_keyword_count + ip_cidr_count + ip_asn_count + others_count))

            {
              echo "# $title 路由规则"
              echo "# REPO: https://github.com/${{ github.repository }}"
              echo "# UPDATED: $(date '+%Y-%m-%d %H:%M:%S')"
              echo "# DOMAIN: $domain_count"
              echo "# DOMAIN-KEYWORD: $domain_keyword_count"
              echo "# DOMAIN-SUFFIX: $domain_suffix_count"
              echo "# IP-ASN: $ip_asn_count"
              echo "# IP-CIDR: $ip_cidr_count"
              echo "# TOTAL: $total_count"
              grep '^DOMAIN,' "$input" || true
              grep '^DOMAIN-SUFFIX,' "$input" || true
              grep '^DOMAIN-KEYWORD,' "$input" || true
              grep '^IP-CIDR,' "$input" || true
              grep '^IP-ASN,' "$input" || true
              grep -Ev '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|IP-CIDR|IP-ASN),' "$input" || true
            } > "$output"
          }

          generate_ruleset build/OpenAI.rules Ruleset/OpenAI.list OpenAI
          generate_ruleset build/ai.rules Ruleset/ai.list AI

      - name: Check whether rules changed
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin release:refs/remotes/origin/release

          for name in OpenAI ai; do
            if ! git show "origin/release:Ruleset/$name.list" > "build/published-$name.list" 2>/dev/null; then
              echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sed '/^# UPDATED:/d' "build/published-$name.list" > "build/published-$name.compare"
            sed '/^# UPDATED:/d' "Ruleset/$name.list" > "build/generated-$name.compare"
            if ! cmp -s "build/published-$name.compare" "build/generated-$name.compare"; then
              echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          echo "Rules have not changed; skipping release"

      - name: Move files to publish directory
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          mkdir -p publish/Ruleset
          cp Ruleset/OpenAI.list Ruleset/ai.list publish/Ruleset/

      - name: Release and upload assets
        if: env.SHOULD_PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            publish/Ruleset/*.list
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Git push assets to release branch
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          auth_header=$(git config --local --get http.https://github.com/.extraheader)
          cd publish
          git init -b release
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "$auth_header"
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://github.com/${{ github.repository }}"
          git push --force --set-upstream origin release

      - name: Purge jsDelivr CDN
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          for file in publish/Ruleset/*.list; do
            name=${file##*/}
            curl --fail --show-error --silent --retry 3 \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/Ruleset/$name" \
              > /dev/null
          done
